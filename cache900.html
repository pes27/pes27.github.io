<!DOCTYPE html>
<html manifest="900.manifest">
<head>
<title>Bashir electronic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="تثبيت ذاكرة التخزين المؤقت دون اتصال بالإنترنت: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="تم تثبيت ذاكرة التخزين المؤقت بنجاح ✔";setTimeout(function(){window.msgs.innerHTML="الآن، اقطع الاتصال بالشبكة، إغلاق المتصفح، وإعادة تشغيله";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="خطأ في تثبيت ذاكرة التخزين المؤقت! - امسح ذاكرة التخزين المؤقت للمتصفح وأعد فتحه.";};
</script>
<h1>واجهة عربية عصرية بأقصى ثبات</h1>
<hr>
<br>
<h1 id=msgs style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;">بدء تثبيت ذاكرة التخزين المؤقت</h1>
<div class="footer">
    الإصدارات المدعومة: <span class="gold" dir="ltr">9.00 — 13.52</span>
    &nbsp;•&nbsp; GoldHEN <span class="gold" dir="ltr">2.4b18.12</span>
</div>

<script>
// تلوين رسائل الحالة تلقائيًا دون التأثير في وظائف التشغيل.
(function () {
    var message = document.getElementById("msgs");
    if (!message) return;

    function updateMessageColor() {
        var text = (message.textContent || "").trim();
        message.classList.remove("msg-success", "msg-failure");
        // إزالة أي لون قديم ضُبط مباشرة من ملفات التشغيل.
        message.style.color = "";

        if (/فشل|تعذر|خطأ|غير مدعوم|مخصصة فقط|FAILED|ERROR|UNSUPPORTED|TIMEOUT|MISMATCH|ABORTED|REBOOT|NOT-FOUND/i.test(text)) {
            message.classList.add("msg-failure");
        } else if (/بنجاح|بالفعل|تم تحميل|تم تثبيت|✔|✓|SUCCESS|\bPASS(?:ED)?\b|\bREADY\b/i.test(text)) {
            message.classList.add("msg-success");
        }
    }

    updateMessageColor();
    if (window.MutationObserver) {
        new MutationObserver(updateMessageColor).observe(message, {
            childList: true,
            characterData: true,
            subtree: true
        });
    }
})();
</script>
</body>
</html>
